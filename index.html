<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                 <h1>Task Master</h1>
                 <p>
                      Day 1: Layout & Writing
                 </p>
            </div>
            <section class="task-input">
                <form id="task-form">
                
                     <p>Task Title</p>
                    <input type="text" id="task-input" placeholder="Enter a new task...">
                
                <p>Description</p>
              
                    <textarea id="description" placeholder="Enter a new description..."></textarea>
                <p>Attachment</p>
                
                    <input type="file" id="attachment-input" placeholder="Choose File">    
                    <button type="submit">Add Task</button>
                </form>
                <div id="task-list">
                    <p>Task Cards will appear here...</p>

                </div>
            </section>
        </div>
    </header> 
    <script src="script.js"></script>
</body>

</html>
