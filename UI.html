<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">


    <div class="header">
        <h1>Task Master </h1>
        <p>Day 3: Simple Delete & Update</p>
    </div>

    <form id="task-form">
        <label for="title">Task Title</label>
        <input type="text" id="title" placeholder="Enter new task title" >

        <label for="description">Task Description</label>
        <textarea id="description" placeholder="Enter task description" ></textarea>
        <label for="image">Attachment</label>

        <input type="file" id="image">

        <button type="submit">Add Task</button>
    </form>

    <div id="task-list"><p>Task card will be displayed here</p></div>
</div>

<script src="script.js"></script>

</body>
</html>
